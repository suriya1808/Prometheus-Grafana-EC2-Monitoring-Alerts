# Line appended to /etc/fstab so the swap file is turned on at every boot.
# Do not replace /etc/fstab with this file. Append the line below once:
#   echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
#
# <file>    <mount point>  <type>  <options>  <dump>  <fsck order>
/swapfile   none           swap    sw         0       0
